# SRO 默认配置（与 main.py 顶部常量对应，yaml 优先）
# 技术路线报告：../可迁移自进化_技术路线/技术路线报告_可迁移自进化Prompt优化.md

# ─── 模型 ───────────────────────────────────────────────
models:
  writer: qwen3.5-flash            # 任务 agent（解题）
  reflection: qwen3.5-plus         # 反射/优化器
  writer_timeout: 200              # AIME 推理需要较长超时（秒）
  reflection_timeout: 60
  writer_enable_thinking: false    # 建议开启（见报告讨论）
  writer_max_response_tokens: 4096

# ─── 训练期：进化骨架（报告 §4.4）──────────────────────
evolve:
  max_metric_calls: 600            # 总 writer 调用预算
  generations: 5                   # G
  children_per_generation: 2       # K
  minibatch_size: 8
  early_stop_window: 10            # Toolbox moment-based 窗口
  early_stop_eta_m: 0.001          # Toolbox ηₘ
  judge_max_retries: 3             # Toolbox LLM Judge 预筛

# ─── 训练期：数据筛选（p1，§4.7.2）────────────────────
data_filter:
  enabled: true                    # E9 消融时置为 false 对比
  top_k: 8                         # 保留的高信息量训练样本数
  n_candidates: 6                  # 方差估计用的候选策略数
  n_responses: 2                   # 每候选每样本响应数

# ─── 条款级正则化（TextReg，§4.6）────────────────────
regularize:
  k_promote: 3                     # 机制 1：晋升所需正向证据计数
  m_recurrence: 2                  # 机制 1：晋升所需跨任务簇复现数
  lambda: 0.5                      # 机制 3：score = gain − λ·ℐ
  clause_ii_threshold: null        # 机制 2：条款 ℐᵢ 入库门限（E8 标定）
  embed_dup_threshold: 0.85        # 条款语义去重阈值
  clause_max_count: 30             # 策略层条款上限（超过触发合并）
  rule_max_count: 50               # 规则层上限（超过触发合并/淘汰）

# ─── 三层检索（§4.3）──────────────────────────────────
retrieval:
  topk_coarse: 20                  # embedding 粗筛
  max_rules: 5                     # 注入规则上限
  max_examples: 3                  # 注入支持集上限
  budget_strategy_chars: 1500      # 策略层字符预算
  budget_rule_chars: 150           # 每条规则预算
  budget_example_chars: 500        # 每条示例预算

# ─── 测试期快速适应（§4.5）────────────────────────────
adapt:
  budget: 20                       # 适应样本数 B
  flip_ratio_threshold: 1.0        # Overthinking 停止阈值
  verify_first: true               # Self-Correction Help：先验证再修正

# ─── 数据 ───────────────────────────────────────────────
data:
  aime_train_val_path: ../AIME/AI-MO___aimo-validation-aime/
  aime_test_path: ../AIME/MathArena___aime_2025/
  math_train_path: ../MATH/train
  math_test_path: ../MATH/test
  n_train_samples: 30
  n_val_samples: 30
  n_test_samples: 15
